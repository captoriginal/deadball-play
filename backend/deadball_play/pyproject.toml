[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deadball-play"
version = "1.0.0rc1"
description = "Terminal application and session layer for Deadball Play."
requires-python = ">=3.10"
dependencies = ["deadball-core>=1.0.0rc1,<2"]

[project.scripts]
deadball-play = "deadball_play.tui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../deadball_core/src"]
